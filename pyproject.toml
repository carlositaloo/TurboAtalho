[project]
name = "turbo-atalho"
version = "0.2.0"
description = "Atalhos de teclado, gerenciamento de clipes e energia para Windows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2.2",
    "keyboard>=0.13.5",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pystray>=0.19.5",
    "pyinstaller>=6.0.0",
]

[project.scripts]
turbo-atalho = "main:main"
