[project]
name = "turbo-atalho"
version = "4.0.0"
description = "Atalhos de teclado, slots de colagem e modo jogo para Windows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "keyboard>=0.13.5",
    "psutil>=5.9.0",
    "pyinstaller>=6.0.0",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
turbo-atalho = "main:main"
